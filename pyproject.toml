[project]
name = "sentinelsleep"
version = "0.1.0"
description = "Audio AI system that detects PTSD nightmares and injects therapeutic audio in real time."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Nithin Reddy", email = "reddy.nithin.0331@gmail.com" }]

dependencies = [
    # ML / models
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "scipy>=1.13.0",
    "librosa>=0.10.2",

    # Audio I/O + mixing
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "numpy>=1.26.0,<2.2.0",

    # Dashboard
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",

    # Utilities
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelsleep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
